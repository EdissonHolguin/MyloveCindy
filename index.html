<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Cindy ❤️</title>

<style>

body{
margin:0;
font-family:'Segoe UI', sans-serif;
background:linear-gradient(135deg,#fbc2eb,#a6c1ee);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
overflow:hidden;
}

.container{
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,0.2);
max-width:420px;
animation:fadeIn 2s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(30px);}
to{opacity:1; transform:translateY(0);}
}

img{
width:200px;
border-radius:20px;
margin-bottom:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
color:#ff4d6d;
margin-bottom:10px;
}

p{
font-size:18px;
color:#444;
}

button{
padding:12px 25px;
font-size:17px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
cursor:pointer;
margin-top:20px;
transition:0.3s;
}

button:hover{
background:#e63956;
transform:scale(1.05);
}

.heart{
position:absolute;
color:#ff4d6d;
animation:fall 6s linear infinite;
opacity:0.7;
}

@keyframes fall{
0%{transform:translateY(-100px);}
100%{transform:translateY(100vh);}
}

</style>

</head>

<body>

<audio autoplay loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_6a0e3c3fbb.mp3?filename=sweet-romantic-background-112199.mp3" type="audio/mpeg">
</audio>

<div class="container">

<h1>Cindy ❤️</h1>

<img src="cindy.jpeg">

<p id="mensaje">
Hoy quiero mostrarte algo especial...
</p>

<button onclick="siguiente()">Continuar</button>

</div>

<script>

let mensajes = [

"Hoy celebramos tu vida 🎂",

"Celebramos la persona maravillosa que eres",

"Tu sonrisa ilumina mis días",

"Gracias por acompañarme en momentos buenos y difíciles",

"Eres muy especial para mí ❤️",

"Feliz cumpleaños Cindy 🎉",

"Tengo un pequeño regalo para ti 👟",

"Espero que este detalle te saque una sonrisa 💖",

"Ahora... abre tu regalo 🎁"

];

let i = 0;

function siguiente(){

if(i < mensajes.length){

document.getElementById("mensaje").innerHTML = mensajes[i];

i++;

}else{

document.getElementById("mensaje").innerHTML =
"Tu regalo es elegir los tenis que más te gusten 👟❤️";

document.querySelector("button").innerHTML = "Ver otra vez";

i = 0;

}

}

function crearCorazon(){

let heart = document.createElement("div");

heart.className = "heart";

heart.innerHTML = "❤️";

heart.style.left = Math.random()*100 + "vw";

heart.style.fontSize = Math.random()*20+15+"px";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),6000);

}

setInterval(crearCorazon,350);

</script>

</body>
</html>
