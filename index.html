<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Cindy ❤️</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 85%;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        img {
            width: 100%;
            max-width: 180px;
            border-radius: 50%; /* Foto circular para más elegancia */
            border: 5px solid #ff4d6d;
            margin-bottom: 15px;
        }

        h1 { color: #ff4d6d; margin: 0 0 10px 0; font-size: 2.2em; }
        
        #mensaje {
            font-size: 1.2rem;
            color: #444;
            min-height: 60px;
            line-height: 1.4;
            transition: all 0.4s ease;
        }

        button {
            padding: 15px 35px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            background: #ff4d6d;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: 0.3s;
        }

        button:hover {
            background: #e63956;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.6);
        }

        /* Corazones de fondo */
        .heart {
            position: absolute;
            top: -10%;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* Estilo de los Globos */
        .balloon {
            position: absolute;
            bottom: -150px;
            width: 60px;
            height: 75px;
            background: #ff4d6d;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rise linear forwards;
        }

        .balloon::after { /* El nudo del globo */
            content: "▲";
            position: absolute;
            bottom: -8px;
            color: inherit;
            font-size: 12px;
        }

        @keyframes rise {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-120vh) rotate(10deg); }
        }

        /* Efecto de explosión */
        .pop {
            animation: explode 0.3s forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
    </style>
</head>
<body>

<audio id="musica" loop>
    <source src="https://www.chosic.com/wp-content/uploads/2021/04/And-So-It-Begins-Inspired-By-Arrival-Music.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1 id="titulo">Para Cindy ❤️</h1>
    <img src="cindy.jpeg" alt="Cindy">
    <p id="mensaje">Tengo algo importante que decirte...</p>
    <button id="btn-next" onclick="siguiente()">Empezar</button>
</div>

<script>
    const mensajes = [
        "Hoy celebramos tu vida 🎂",
        "La persona más maravillosa que conozco",
        "Tu sonrisa ilumina cada uno de mis días",
        "Gracias por estar conmigo en todo momento",
        "Eres el regalo más bonito ❤️",
        "¡Feliz Cumpleaños, mi vida! 🎉",
        "Tengo un detalle especial preparado... 👟",
        "Espero que esto te haga sonreír tanto como tú a mí 💖",
        "Tu regalo es: ¡Elige los tenis que más te gusten! 👟🎁"
    ];

    let i = 0;
    const pMensaje = document.getElementById("mensaje");
    const btn = document.getElementById("btn-next");
    const audio = document.getElementById("musica");
    let globosInterval;

    function siguiente() {
        // Intento forzado de reproducción de audio al primer clic
        if (i === 0) {
            audio.play().catch(error => console.log("Error de audio:", error));
        }

        if (i < mensajes.length) {
            pMensaje.style.opacity = 0;
            
            setTimeout(() => {
                pMensaje.innerHTML = mensajes[i];
                pMensaje.style.opacity = 1;
                
                // Si es el último mensaje, lanzamos globos
                if (i === mensajes.length - 1) {
                    lanzarGlobos();
                    btn.innerHTML = "¡Te amo! ❤️";
                } else {
                    btn.innerHTML = "Continuar";
                }
                i++;
            }, 300);
        } else {
            // Reiniciar flujo si se desea
            location.reload(); 
        }
    }

    // Lluvia de corazones constante
    function crearCorazon() {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        const duracion = Math.random() * 3 + 4;
        heart.style.animationDuration = duracion + "s";
        heart.style.fontSize = Math.random() * 15 + 10 + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), duracion * 1000);
    }
    setInterval(crearCorazon, 400);

    // Lógica de los globos
    function lanzarGlobos() {
        globosInterval = setInterval(() => {
            const colors = ['#ff4d6d', '#ff758c', '#ffb3c1', '#a6c1ee', '#9575cd'];
            const balloon = document.createElement("div");
            balloon.className = "balloon";
            balloon.style.left = Math.random() * 90 + "vw";
            balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            const duracion = Math.random() * 2 + 5;
            balloon.style.animationDuration = duracion + "s";
            
            // Al hacer clic en el globo, explota
            balloon.onclick = function() {
                this.classList.add('pop');
                setTimeout(() => this.remove(), 300);
            };

            document.body.appendChild(balloon);
            setTimeout(() => balloon.remove(), duracion * 1000);
        }, 600);
    }
</script>
</body>
</html>
