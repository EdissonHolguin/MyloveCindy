<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Cindy ❤️</title>

<style>

body{
margin:0;
font-family:'Segoe UI', sans-serif;
background:linear-gradient(135deg,#fbc2eb,#a6c1ee);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
overflow:hidden;
}

.container{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
max-width:450px;
}

h1{
color:#ff4d6d;
margin-bottom:10px;
}

p{
font-size:18px;
color:#444;
}

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#e63956;
}

img{
width:200px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.heart{
position:absolute;
color:#ff4d6d;
animation:fall 5s linear infinite;
}

@keyframes fall{
0%{transform:translateY(-100px);}
100%{transform:translateY(100vh);}
}

</style>
</head>

<body>

<audio autoplay loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_6a0e3c3fbb.mp3?filename=sweet-romantic-background-112199.mp3" type="audio/mpeg">
</audio>

<div class="container">

<img src="cindy.jpeg">

<h1>Cindy ❤️</h1>

<p id="mensaje">
Hoy quiero decirte algo especial...
</p>

<button onclick="siguiente()">Siguiente</button>

</div>

<script>

let mensajes = [

"Hoy celebramos algo muy especial 🎂",

"Celebramos tu vida y lo importante que eres para mí",

"Gracias por acompañarme en momentos buenos y difíciles",

"Eres una persona muy especial para mí ❤️",

"Tu sonrisa ilumina mis días",

"Feliz cumpleaños Cindy 🎉",

"Tengo un pequeño regalo para ti 👟",

"Revisa tu Bancolombia 😉"

];

let i = 0;

function siguiente(){

if(i < mensajes.length){

document.getElementById("mensaje").innerHTML = mensajes[i];
i++;

}else{

document.getElementById("mensaje").innerHTML =
"Espero que este pequeño detalle te saque una sonrisa 💖";

document.querySelector("button").innerHTML = "Ver otra vez";

i = 0;

}

}

function crearCorazon(){

let heart = document.createElement("div");

heart.className = "heart";

heart.innerHTML = "❤️";

heart.style.left = Math.random()*100 + "vw";

heart.style.fontSize = Math.random()*20+10+"px";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),5000);

}

setInterval(crearCorazon,300);

</script>

</body>
</html>

</body>
</html>
