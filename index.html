<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Cindy ❤️</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            max-width: 420px;
            width: 90%;
            z-index: 10;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        img {
            width: 100%;
            max-width: 200px;
            height: auto;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 { color: #ff4d6d; margin-bottom: 10px; }
        
        /* Clase para efecto de desvanecimiento al cambiar texto */
        .fade-text {
            transition: opacity 0.5s;
            font-size: 18px;
            color: #444;
            min-height: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 17px;
            border: none;
            border-radius: 25px;
            background: #ff4d6d;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            outline: none;
        }

        button:hover {
            background: #e63956;
            transform: scale(1.05);
        }

        .heart {
            position: absolute;
            top: -10%;
            color: #ff4d6d;
            animation: fall linear forwards;
            opacity: 0.7;
            pointer-events: none;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

<audio id="musica" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_6a0e3c3fbb.mp3?filename=sweet-romantic-background-112199.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1>Cindy ❤️</h1>
    <img src="cindy.jpeg" alt="Cindy">
    <p id="mensaje" class="fade-text">Hoy quiero mostrarte algo especial...</p>
    <button id="btn-next" onclick="siguiente()">Empezar</button>
</div>

<script>
    const mensajes = [
        "Hoy celebramos tu vida 🎂",
        "Celebramos la persona maravillosa que eres",
        "Tu sonrisa ilumina mis días",
        "Gracias por acompañarme en momentos buenos y difíciles",
        "Eres muy especial para mí ❤️",
        "Feliz cumpleaños Cindy 🎉",
        "Tengo un pequeño regalo para ti 👟",
        "Espero que este detalle te saque una sonrisa 💖",
        "Tu regalo es elegir los tenis que más te gusten 👟❤️"
    ];

    let i = 0;
    const pMensaje = document.getElementById("mensaje");
    const btn = document.getElementById("btn-next");
    const audio = document.getElementById("musica");

    function siguiente() {
        // Reproducir audio al primer clic
        if (audio.paused) {
            audio.play().catch(e => console.log("Audio esperando interacción"));
        }

        if (i < mensajes.length) {
            // Efecto de parpadeo suave al cambiar texto
            pMensaje.style.opacity = 0;
            
            setTimeout(() => {
                pMensaje.innerHTML = mensajes[i];
                pMensaje.style.opacity = 1;
                i++;
                
                if(i === mensajes.length) {
                    btn.innerHTML = "Ver otra vez";
                } else {
                    btn.innerHTML = "Continuar";
                }
            }, 300);

        } else {
            // Reiniciar
            i = 0;
            pMensaje.innerHTML = "Hoy quiero mostrarte algo especial...";
            btn.innerHTML = "Empezar";
        }
    }

    function crearCorazon() {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        // Duración aleatoria para que se vea más natural
        const duracion = Math.random() * 3 + 3;
        heart.style.animationDuration = duracion + "s";
        heart.style.fontSize = Math.random() * 20 + 15 + "px";
        
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), duracion * 1000);
    }

    setInterval(crearCorazon, 350);
</script>
</body>
</html>
