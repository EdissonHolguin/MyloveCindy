<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Cindy ❤️</title>
    <style>
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; text-align: center; overflow: hidden; position: relative;
        }

        /* Capa de inicio (Globos para reventar) */
        #capa-inicio {
            position: absolute; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 200; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 1s;
        }

        #mensaje-inicial { font-size: 1.5rem; color: #ff4d6d; margin-bottom: 50px; }

        /* Contenedor Principal (Carta - oculto al inicio) */
        .container {
            background: white; padding: 40px; border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            max-width: 400px; width: 85%; z-index: 100;
            display: none; /* Se activa con JS */
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }

        img { width: 100%; max-width: 180px; border-radius: 50%; border: 5px solid #ff4d6d; margin-bottom: 15px; }
        h1 { color: #ff4d6d; margin-bottom: 10px; }
        #mensaje { font-size: 1.1rem; color: #444; min-height: 50px; transition: opacity 0.3s; }

        button {
            padding: 12px 25px; font-size: 1rem; border: none;
            border-radius: 25px; background: #ff4d6d; color: white;
            cursor: pointer; margin-top: 20px; transition: 0.3s;
        }
        button:hover { background: #e63956; transform: scale(1.05); }

        /* Estilos de los Globos (Inicio) */
        .balloon-start {
            width: 80px; height: 100px; border-radius: 50%;
            cursor: pointer; position: relative; transition: transform 0.2s;
            box-shadow: inset -10px -10px 15px rgba(0,0,0,0.1);
            animation: float 3s ease-in-out infinite; margin: 0 30px;
        }
        .balloon-start::after { content: ""; position: absolute; bottom: -10px; left: 35px; border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 10px solid; color: inherit;}
        
        #globo1 { background-color: #ff4d6d; color: #ff4d6d; }
        #globo2 { background-color: #a6c1ee; color: #a6c1ee; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* Efecto Explosión */
        .pop { animation: explode 0.3s forwards; pointer-events: none; }
        @keyframes explode { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

        /* Fresas que aparecen */
        .strawberry { font-size: 3rem; animation: fantaSlide 1s ease-out forwards; position: relative; z-index: 210; margin-bottom: 20px; }
        @keyframes fantaSlide { 0% { opacity: 0; transform: translateY(50px) scale(0.5); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

        /* Corazones de fondo */
        .heart { position: absolute; top: -10%; color: #ff4d6d; animation: fall linear forwards; opacity: 0.7; pointer-events: none; z-index: 50;}
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

    </style>
</head>
<body>

<audio id="musica" loop preload="auto">
    <source src="https://cdn.pixabay.com/audio/2024/02/19/audio_d06f6583971e411b0e91.mp3" type="audio/mpeg">
</audio>

<div id="capa-inicio">
    <p id="mensaje-inicial">Para Cindy, con amor...<br>Pon sonido y explota los globos 🎈🎈</p>
    
    <div style="display: flex;">
        <div id="globo1" class="balloon-start" onclick="explotarGlobo(1)"></div>
        <div id="globo2" class="balloon-start" onclick="explotarGlobo(2)" style="animation-delay: 0.5s;"></div>
    </div>
    
    <div id="cont-fresas" style="display:flex; flex-direction:column; align-items:center; margin-top: 30px;"></div>
    
    <button id="btn-comenzar-carta" style="display:none;" onclick="mostrarCarta()">Leer tu carta ❤️</button>
</div>

<div class="container" id="main-container">
    <h1>Cindy ❤️</h1>
    <img src="cindy.jpeg" alt="Cindy">
    <p id="mensaje">Hoy quiero mostrarte algo especial...</p>
    <button id="btn-next" onclick="siguiente()">Continuar</button>
</div>

<script>
    const mensajes = [
        "Hoy celebramos tu vida 🎂",
        "La persona más maravillosa que eres",
        "Tu sonrisa ilumina mis días",
        "Gracias por acompañarme en todo momento",
        "Eres muy especial para mí ❤️",
        "¡Feliz cumpleaños Cindy! 🎉",
        "Tengo un pequeño regalo para ti 👟",
        "Espero que este detalle te saque una sonrisa 💖",
        "Tu regalo es elegir los tenis que más te gusten 👟❤️"
    ];

    let i = 0;
    let globosExplotados = 0;
    const audio = document.getElementById("musica");

    // === Fase 1: Los dos globos iniciales ===
    function explotarGlobo(num) {
        const globo = document.getElementById(`globo${num}`);
        globo.classList.add('pop');
        globosExplotados++;

        // Intento de reproducir música en CADA clic (para asegurar permisos)
        audio.play().catch(e => console.log("Música esperando permiso."));

        setTimeout(() => {
            globo.style.visibility = 'hidden';
            crearFresa();
        }, 300);
    }

    function crearFresa() {
        const cont = document.getElementById('cont-fresas');
        const straw = document.createElement('div');
        straw.className = 'strawberry';
        
        if(globosExplotados === 1) {
            straw.innerHTML = "🍓 <span style='font-size:1.2rem; color:#444;'>Prepárate...</span>";
        } else if (globosExplotados === 2) {
            straw.innerHTML = "🍓🍓 <span style='font-size:1.2rem; color:#444;'>...para tu cumpleaños</span>";
            // Mostramos el botón para ir a la carta
            document.getElementById('btn-comenzar-carta').style.display = 'block';
            document.getElementById('mensaje-inicial').style.display = 'none';
        }
        
        cont.appendChild(straw);
    }

    // Transición de Globos a Carta
    function mostrarCarta() {
        document.getElementById('capa-inicio').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('capa-inicio').style.display = 'none';
            document.getElementById('main-container').style.display = 'block';
        }, 1000);
    }


    // === Fase 2: La Carta (Lo que ya tenías) ===
    function siguiente() {
        // Doble asegurado de música (por si acaso)
        if(audio.paused) audio.play();

        const pMensaje = document.getElementById("mensaje");
        const btn = document.getElementById("btn-next");

        if(i < mensajes.length){
            pMensaje.style.opacity = 0;
            setTimeout(() => {
                pMensaje.innerHTML = mensajes[i];
                pMensaje.style.opacity = 1;
                i++;
                if(i === mensajes.length) {
                    btn.innerHTML = "Ver otra vez";
                } else {
                    btn.innerHTML = "Continuar";
                }
            }, 300);
        } else {
            i = 0;
            pMensaje.innerHTML = "Tu regalo es elegir los tenis que más te gusten 👟❤️";
            btn.innerHTML = "Ver otra vez";
        }
    }

    // Corazones de fondo constantes
    function crearCorazon(){
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        const duracion = Math.random() * 3 + 3;
        heart.style.animationDuration = duracion + "s";
        heart.style.fontSize = Math.random() * 20 + 15 + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), duracion * 1000);
    }
    setInterval(crearCorazon, 400);

</script>
</body>
</html>
